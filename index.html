<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Bot Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07090e;
            --card-bg: rgba(20, 25, 35, 0.65);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
        }

        body {
            background-color: var(--bg-color);
            /* เพิ่มแสงสีออโรร่าที่มุมจอให้พื้นหลังดูไม่น่าเบื่อ */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 229, 255, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(106, 0, 255, 0.08), transparent 25%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Container & Glassmorphism */
        .container {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: floatUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            width: 320px;
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Avatar Section */
        .avatar-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.5rem;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.1);
            padding: 4px;
            background: linear-gradient(135deg, var(--accent), #6a00ff);
            transition: all 0.4s ease;
        }

        .avatar-wrapper:hover .avatar {
            transform: scale(1.05) rotate(5deg);
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.4);
        }

        /* Discord-style Status Dot */
        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background-color: #23a559;
            border: 4px solid #10141d;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(35, 165, 89, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(35, 165, 89, 0); }
            100% { box-shadow: 0 0 0 0 rgba(35, 165, 89, 0); }
        }

        /* Typography */
        .bot-name {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 0.3rem;
            background: linear-gradient(to right, #ffffff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-text {
            font-size: 0.85rem;
            color: #23a559;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
        }

        .uptime-container {
            background: rgba(0, 0, 0, 0.4);
            padding: 1.2rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .uptime {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            margin-bottom: 0.3rem;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
        }

        .uptime-label {
            color: var(--text-muted);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar-wrapper">
            <img id="bot-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Bot Avatar" class="avatar">
            <div class="status-dot"></div>
        </div>
        
        <div class="bot-name" id="bot-name">SIX-ONE-NINE</div>
        <div class="status-text">Operational</div>
        
        <div class="uptime-container">
            <div class="uptime" id="uptime">0h 0m 0s</div>
            <div class="uptime-label">System Uptime</div>
        </div>
    </div>

    <script>
        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('uptime').innerText = data.uptime;
                if (data.avatar) {
                    document.getElementById('bot-avatar').src = data.avatar;
                }
            } catch (err) {
                console.error("กำลังเชื่อมต่อ...", err);
            }
        }
        setInterval(fetchStatus, 1000);
        fetchStatus();
    </script>
</body>
</html>
